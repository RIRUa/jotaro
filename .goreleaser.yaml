version: 2

project_name: jotaro

builds:
  - id: jotaro
    main: ./cmd/jotaro
    binary: jotaro
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # CHANGELOG.md is the source of truth, so do not attach an auto-generated list to the release notes.
  disable: true
