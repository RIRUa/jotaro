version: 2

project_name: jotaro

builds:
  - id: jotaro
    main: ./cmd/jotaro
    binary: jotaro
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt

# No "changelog" section on purpose: the release notes are the matching CHANGELOG.md section,
# passed with --release-notes by .github/workflows/release.yml (which overrides the auto-generated
# list). Do not set "changelog.disable: true": it also skips --release-notes and leaves the body empty.
