name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lower bound in go.mod and the latest stable release. CPU time collection differs per OS, so run on all 3 OSes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', 'stable']
        exclude:
          # Go 1.22 test binaries built with -race are rejected by the dyld of recent macOS (missing LC_UUID load command).
          - os: macos-latest
            go: '1.22'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
