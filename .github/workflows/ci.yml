name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel the outdated run when a pull request is updated. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The lower bound in go.mod and the latest stable release. CPU time collection differs per OS, so run on all 3 OSes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25', 'stable']
        exclude:
          # macos-latest jobs often stay queued, so run only one macOS job. The lower bound is covered by the other OSes.
          - os: macos-latest
            go: '1.25'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race ./...
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.go == 'stable') }}
      # One cell also records statement coverage and shows it in the job summary, so a pull request
      # that drops coverage is visible. The examples are programs, not library code, and are left out.
      - name: go test -race with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go == 'stable' }}
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v /examples/)
      - name: go test -race ./examples/...
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go == 'stable' }}
        run: go test -race ./examples/...
      - name: Coverage summary
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go == 'stable' }}
        run: |
          {
            echo '### Test coverage (statements, examples excluded)'
            echo
            scripts/coverage-summary.sh coverage.out
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  # go.mod / go.sum and THIRD_PARTY_NOTICES.md are maintained by hand (or by Dependabot, which
  # does not regenerate the notices), so check that they match what the tools produce.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: |
          scripts/gen-third-party-notices.sh
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
