name: release

# Merging a pull request from a release/vX.Y.Z branch into main tags vX.Y.Z on the merge commit,
# builds the CLI binaries and attaches them to a GitHub Release whose notes are the matching
# CHANGELOG.md section. Prepare the branch with scripts/prepare-release.sh (see CONTRIBUTING.md).
#
# The tag is pushed and GoReleaser runs in this same workflow on purpose: a tag pushed with
# GITHUB_TOKEN does not start other workflows, so a separate "on: push: tags" workflow would never run.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-run a release whose publishing step failed (the tag is reused), or release main directly.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, X.Y.Z (a leading v is accepted)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version
        id: target
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            version=${INPUT_VERSION#v}
          else
            version=${HEAD_REF#release/v}
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the version must look like X.Y.Z (branch release/vX.Y.Z), got: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # For a merged pull request, release exactly the merge commit. Empty for workflow_dispatch (= main).
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            if [ "$(git rev-list -n1 "$tag")" != "$(git rev-parse HEAD)" ]; then
              if [ "$EVENT" != workflow_dispatch ]; then
                echo "::error::$tag already exists on a different commit"
                exit 1
              fi
              # Re-publishing an existing release: build from the tagged commit.
              git checkout -q "$tag"
            fi
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      # Fails the release when CHANGELOG.md has no (or an empty) section for this version.
      - name: Extract the release notes
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Push the tag
        if: steps.tag.outputs.create == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ steps.target.outputs.version }}
