name: vulncheck

# Reports known vulnerabilities (Go vulnerability database) that the code actually calls, in
# dependencies and in the standard library. A new advisory can turn this red without any change in
# the repository, so it is not a required check; the weekly run is what notices it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      # Pinned so that a new govulncheck release cannot change the result or break the job without a
      # change here. Bump it on purpose.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
