version: "2"

linters:
  # Use the defaults as is (errcheck / govet / ineffassign / staticcheck / unused).
  default: standard
  settings:
    errcheck:
      # By design, errors from write targets (io.Writer) are ignored. Close on the read side is idiomatically ignored too.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
  exclusions:
    rules:
      # Do not require checking return values in tests and examples.
      - path: _test\.go
        linters:
          - errcheck
      - path: ^examples/
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
